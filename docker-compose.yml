services:
  terriamap:
    image: visor-smyeg-fao:latest
    build:
      context: .
      target: deploy
    container_name: visor-smyeg-fao
    restart: unless-stopped

    # MAPEO DE PUERTOS
    ports:
      - "3000:3001"

    # VARIABLES DE ENTORNO
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=4096

    # LÍMITES DE RECURSOS
    mem_limit: 6g
    mem_reservation: 2g
    cpus: "3.5"

    # LOGGING ROTATIVO
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # ULIMITS
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    # CATÁLOGOS DINÁMICOS DE GEOLENS
    volumes:
      - ./smyeg_geolens_auto.json:/app/wwwroot/init/smyeg_geolens_auto.json:ro
      - ./runtime/geolens:/app/wwwroot/init/geolens:ro
      - ./runtime/branding/config.json:/app/wwwroot/config.json:ro
      - ./wwwroot/caroni-branding:/app/wwwroot/caroni-branding:ro
      - ./wwwroot/images/logo_fao.svg:/app/wwwroot/images/logo_fao.svg:ro

    networks:
      - terriamap-net
      - geolens

  # ============================================================
  # SINCRONIZADOR DINÁMICO DE TODAS LAS COLLECTIONS GEOLENS
  # ============================================================
  geolens-sync:
    image: node:22-alpine
    container_name: geolens-sync
    restart: unless-stopped
    working_dir: /sync

    command:
      - node
      - /sync/geolens_collections_to_terria.mjs
      - --base
      - https://catalogo.caroni.org.ve
      - --api-base
      - http://geolens-api-1:8000
      - --output-dir
      - /data/collections
      - --index-output
      - /data/geolens-collections.json
      - --public-prefix
      - init/geolens/collections
      - --watch
      - "300"
      - --limit
      - "100000"
      - --concurrency
      - "3"
      - --timeout
      - "20000"
      - --retries
      - "3"

    volumes:
      - ./geolens_collections_to_terria.mjs:/sync/geolens_collections_to_terria.mjs:ro
      - ./runtime/geolens:/data

    mem_limit: 256m
    mem_reservation: 64m
    cpus: "0.25"

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

    init: true

    networks:
      - terriamap-net
      - geolens

networks:
  terriamap-net:
    driver: bridge
  geolens:
    external: true
    name: geolens_default
